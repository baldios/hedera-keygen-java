<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow — Gestione Lavoro e Scadenze</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
:root{--bg:#f5f7fa;--bg-card:#ffffff;--bg-sidebar:#1e1e2e;--sidebar-text:#cdd6f4;--sidebar-active-bg:rgba(137,180,250,.15);--sidebar-active-text:#89b4fa;--sidebar-hover-bg:rgba(255,255,255,.06);--text-primary:#1e2030;--text-secondary:#6c7086;--text-muted:#9399b2;--border:#e2e8f0;--border-focus:#89b4fa;--accent:#6366f1;--accent-hover:#4f52e0;--accent-light:#eef2ff;--danger:#f43f5e;--danger-light:#fff1f2;--warning:#f59e0b;--warning-light:#fffbeb;--success:#10b981;--success-light:#ecfdf5;--priority-high:#ef4444;--priority-high-bg:#fef2f2;--priority-medium:#f59e0b;--priority-medium-bg:#fffbeb;--priority-low:#10b981;--priority-low-bg:#ecfdf5;--priority-none:#94a3b8;--priority-none-bg:#f8fafc;--shadow-sm:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.06);--shadow-md:0 4px 12px rgba(0,0,0,.1);--shadow-lg:0 8px 30px rgba(0,0,0,.15);--radius-sm:6px;--radius:10px;--radius-lg:16px;--sidebar-w:240px;--topbar-h:60px;--transition:200ms ease;--font:'Inter',-apple-system,BlinkMacSystemFont,sans-serif}
[data-theme="dark"]{--bg:#181825;--bg-card:#1e1e2e;--text-primary:#cdd6f4;--text-secondary:#a6adc8;--text-muted:#6c7086;--border:#313244;--accent-light:#1e1e3e;--danger-light:#2a1020;--warning-light:#2a1e00;--success-light:#0d2218;--priority-high-bg:#2a1010;--priority-medium-bg:#2a1e00;--priority-low-bg:#0d2218;--priority-none-bg:#1e1e2e;--shadow-sm:0 1px 3px rgba(0,0,0,.3);--shadow-md:0 4px 12px rgba(0,0,0,.4);--shadow-lg:0 8px 30px rgba(0,0,0,.5)}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{font-size:16px;scroll-behavior:smooth}
body{font-family:var(--font);background:var(--bg);color:var(--text-primary);display:flex;min-height:100vh;transition:background var(--transition),color var(--transition)}
a{text-decoration:none;color:inherit}
button{cursor:pointer;font-family:inherit;border:none;background:none}
input,select,textarea{font-family:inherit}
.sidebar{width:var(--sidebar-w);background:var(--bg-sidebar);display:flex;flex-direction:column;position:fixed;top:0;left:0;height:100vh;z-index:200;transition:transform var(--transition);overflow-y:auto}
.sidebar-header{display:flex;align-items:center;justify-content:space-between;padding:20px 16px 16px;border-bottom:1px solid rgba(255,255,255,.08)}
.logo{display:flex;align-items:center;gap:10px}
.logo-icon{font-size:24px}
.logo-text{font-size:18px;font-weight:700;color:#cdd6f4;letter-spacing:-.02em}
.sidebar-close{color:var(--sidebar-text);opacity:.6;display:none;font-size:16px}
.sidebar-nav{flex:1;padding:12px 8px;display:flex;flex-direction:column;gap:2px}
.nav-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--sidebar-text);font-size:14px;font-weight:500;transition:background var(--transition),color var(--transition)}
.nav-item:hover{background:var(--sidebar-hover-bg)}
.nav-item.active{background:var(--sidebar-active-bg);color:var(--sidebar-active-text)}
.nav-icon{font-size:16px;width:20px;text-align:center}
.nav-label{flex:1}
.nav-badge{background:rgba(137,180,250,.2);color:#89b4fa;font-size:11px;font-weight:600;padding:2px 7px;border-radius:20px;min-width:20px;text-align:center}
.nav-badge.urgent{background:rgba(244,63,94,.2);color:#f43f5e}
.nav-badge:empty{display:none}
.sidebar-footer{padding:16px;border-top:1px solid rgba(255,255,255,.08)}
.btn-notif{width:100%;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--radius-sm);color:var(--sidebar-text);font-size:13px;font-weight:500;transition:background var(--transition);opacity:.8}
.btn-notif:hover{background:var(--sidebar-hover-bg);opacity:1}
.overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:150;backdrop-filter:blur(2px)}
.main{flex:1;margin-left:var(--sidebar-w);display:flex;flex-direction:column;min-height:100vh;max-width:100%;padding-bottom:80px}
.topbar{position:sticky;top:0;z-index:100;background:var(--bg);border-bottom:1px solid var(--border);height:var(--topbar-h);display:flex;align-items:center;gap:12px;padding:0 24px;transition:background var(--transition)}
.menu-toggle{display:none;font-size:20px;color:var(--text-primary)}
.page-title{flex:1;font-size:18px;font-weight:700;color:var(--text-primary)}
.topbar-actions{display:flex;gap:8px}
.btn-icon{width:36px;height:36px;border-radius:var(--radius-sm);display:flex;align-items:center;justify-content:center;font-size:16px;color:var(--text-secondary);transition:background var(--transition),color var(--transition)}
.btn-icon:hover{background:var(--border);color:var(--text-primary)}
.quick-add{padding:20px 24px 0}
.quick-add-form{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);transition:box-shadow var(--transition),border-color var(--transition)}
.quick-add-form:focus-within{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(99,102,241,.12),var(--shadow-sm)}
.quick-add-input{width:100%;padding:16px 20px;font-size:15px;font-weight:500;border:none;background:transparent;color:var(--text-primary);outline:none}
.quick-add-input::placeholder{color:var(--text-muted);font-weight:400}
.quick-add-meta{display:flex;align-items:center;gap:12px;padding:12px 16px;border-top:1px solid var(--border);background:var(--bg);flex-wrap:wrap}
.field-group{display:flex;align-items:center;gap:6px}
.field-label{font-size:12px;font-weight:600;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.04em;white-space:nowrap}
.field-input{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:13px;outline:none;transition:border-color var(--transition);max-width:150px}
.field-input:focus{border-color:var(--border-focus)}
.btn-add{margin-left:auto;padding:8px 18px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:background var(--transition),transform var(--transition);white-space:nowrap}
.btn-add:hover{background:var(--accent-hover)}
.btn-add:active{transform:scale(.97)}
.controls{display:flex;align-items:center;justify-content:space-between;padding:16px 24px;gap:12px}
.controls-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
.sort-group{display:flex;align-items:center;gap:8px}
.sort-select{padding:6px 10px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg-card);color:var(--text-primary);font-size:13px;outline:none;cursor:pointer}
.view-group{display:flex;gap:4px}
.btn-view{width:34px;height:34px;border-radius:var(--radius-sm);font-size:16px;color:var(--text-secondary);border:1px solid var(--border);transition:all var(--transition)}
.btn-view:hover{border-color:var(--border-focus);color:var(--accent)}
.btn-view.active{background:var(--accent);border-color:var(--accent);color:#fff}
.task-container{padding:0 24px 24px;flex:1}
.task-list{display:flex;flex-direction:column;gap:8px}
.task-list.grid-view{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px}
.task-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;display:flex;align-items:flex-start;gap:12px;box-shadow:var(--shadow-sm);transition:box-shadow var(--transition),border-color var(--transition),opacity var(--transition);position:relative;border-left:3px solid transparent;cursor:default;animation:slideIn 200ms ease}
@keyframes slideIn{from{opacity:0;transform:translateY(-6px)}to{opacity:1;transform:translateY(0)}}
.task-card:hover{box-shadow:var(--shadow-md);border-color:var(--border-focus)}
.task-card.done{opacity:.55}
.task-card.done .task-title{text-decoration:line-through;color:var(--text-muted)}
.task-card[data-priority="high"]{border-left-color:var(--priority-high)}
.task-card[data-priority="medium"]{border-left-color:var(--priority-medium)}
.task-card[data-priority="low"]{border-left-color:var(--priority-low)}
.task-checkbox{width:20px;height:20px;border:2px solid var(--border);border-radius:50%;flex-shrink:0;margin-top:1px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:border-color var(--transition),background var(--transition);font-size:11px;color:transparent}
.task-checkbox:hover{border-color:var(--accent)}
.task-card.done .task-checkbox{background:var(--success);border-color:var(--success);color:#fff}
.task-body{flex:1;min-width:0}
.task-title{font-size:14px;font-weight:600;color:var(--text-primary);line-height:1.4;margin-bottom:4px}
.task-desc{font-size:13px;color:var(--text-secondary);line-height:1.5;margin-bottom:8px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.task-meta{display:flex;align-items:center;flex-wrap:wrap;gap:6px}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 8px;border-radius:20px;font-size:11px;font-weight:600;letter-spacing:.02em}
.badge-priority-high{background:var(--priority-high-bg);color:var(--priority-high)}
.badge-priority-medium{background:var(--priority-medium-bg);color:var(--priority-medium)}
.badge-priority-low{background:var(--priority-low-bg);color:var(--priority-low)}
.badge-priority-none{display:none}
.badge-date{background:var(--accent-light);color:var(--accent)}
.badge-date.overdue{background:var(--danger-light);color:var(--danger)}
.badge-date.today{background:var(--warning-light);color:var(--warning)}
.badge-date.soon{background:var(--success-light);color:var(--success)}
.badge-cat-work{background:#ede9fe;color:#7c3aed}
.badge-cat-personal{background:#fce7f3;color:#be185d}
.badge-cat-other{background:#f0fdf4;color:#15803d}
.task-actions{display:flex;gap:2px;opacity:0;transition:opacity var(--transition);flex-shrink:0}
.task-card:hover .task-actions{opacity:1}
.task-action-btn{width:30px;height:30px;border-radius:var(--radius-sm);font-size:14px;color:var(--text-muted);transition:background var(--transition),color var(--transition)}
.task-action-btn:hover{background:var(--border);color:var(--text-primary)}
.task-action-btn.delete:hover{background:var(--danger-light);color:var(--danger)}
.empty-state{text-align:center;padding:60px 20px}
.empty-icon{font-size:48px;margin-bottom:16px}
.empty-title{font-size:18px;font-weight:700;color:var(--text-primary);margin-bottom:8px}
.empty-sub{font-size:14px;color:var(--text-secondary)}
.modal-backdrop{position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:500;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);animation:fadeIn 150ms ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.modal{background:var(--bg-card);border-radius:var(--radius-lg);width:100%;max-width:520px;box-shadow:var(--shadow-lg);overflow:hidden;animation:slideUp 200ms ease}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
.modal-header{display:flex;align-items:center;justify-content:space-between;padding:20px 24px 16px;border-bottom:1px solid var(--border)}
.modal-title{font-size:18px;font-weight:700}
.modal-form{padding:20px 24px 24px;display:flex;flex-direction:column;gap:16px}
.form-group{display:flex;flex-direction:column;gap:6px}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form-label{font-size:13px;font-weight:600;color:var(--text-secondary)}
.form-input{padding:10px 12px;border:1px solid var(--border);border-radius:var(--radius-sm);background:var(--bg);color:var(--text-primary);font-size:14px;outline:none;transition:border-color var(--transition),box-shadow var(--transition)}
.form-input:focus{border-color:var(--border-focus);box-shadow:0 0 0 3px rgba(99,102,241,.1)}
.form-textarea{resize:vertical;min-height:80px}
.modal-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:4px}
.btn-primary{padding:10px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-sm);font-size:14px;font-weight:600;transition:background var(--transition)}
.btn-primary:hover{background:var(--accent-hover)}
.btn-secondary{padding:10px 20px;border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:500;color:var(--text-secondary);background:var(--bg);transition:background var(--transition)}
.btn-secondary:hover{background:var(--border);color:var(--text-primary)}
.toast-container{position:fixed;bottom:24px;right:24px;display:flex;flex-direction:column;gap:8px;z-index:1000}
.toast{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 16px;font-size:14px;font-weight:500;box-shadow:var(--shadow-md);display:flex;align-items:center;gap:8px;min-width:240px;max-width:360px;animation:toastIn 250ms ease;transition:opacity 300ms ease,transform 300ms ease}
.toast.hiding{opacity:0;transform:translateX(20px)}
.toast-success{border-left:3px solid var(--success)}
.toast-error{border-left:3px solid var(--danger)}
.toast-info{border-left:3px solid var(--accent)}
@keyframes toastIn{from{opacity:0;transform:translateX(20px)}to{opacity:1;transform:translateX(0)}}
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;background:var(--bg-card);border-top:1px solid var(--border);z-index:100;padding-bottom:env(safe-area-inset-bottom,0)}
.bottom-nav-item{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 4px 8px;color:var(--text-muted);font-size:11px;font-weight:500;transition:color var(--transition)}
.bottom-nav-item.active{color:var(--accent)}
.bottom-nav-icon{font-size:20px}
::-webkit-scrollbar{width:6px}
::-webkit-scrollbar-track{background:transparent}
::-webkit-scrollbar-thumb{background:var(--border);border-radius:3px}
::-webkit-scrollbar-thumb:hover{background:var(--text-muted)}
@media(max-width:768px){
  .sidebar{transform:translateX(-100%);width:280px}
  .sidebar.open{transform:translateX(0);box-shadow:var(--shadow-lg)}
  .sidebar-close{display:flex}
  .overlay.visible{display:block}
  .main{margin-left:0;padding-bottom:70px}
  .menu-toggle{display:flex}
  .topbar{padding:0 16px}
  .page-title{font-size:16px}
  .quick-add{padding:14px 16px 0}
  .quick-add-meta{padding:10px 12px;gap:8px}
  .field-group{flex-direction:column;align-items:flex-start;gap:3px}
  .field-input{max-width:100%;width:140px}
  .btn-add{width:100%;margin-top:4px;text-align:center}
  .controls{padding:12px 16px}
  .task-container{padding:0 16px 16px}
  .task-list.grid-view{grid-template-columns:1fr}
  .bottom-nav{display:flex}
  .toast-container{bottom:80px;right:16px;left:16px}
  .toast{min-width:unset}
  .form-row{grid-template-columns:1fr}
}
@media(max-width:480px){
  .quick-add-input{font-size:14px}
  .task-card{padding:12px 14px}
  .task-actions{opacity:1}
}
[hidden]{display:none!important}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-header">
      <div class="logo"><span class="logo-icon">⚡</span><span class="logo-text">TaskFlow</span></div>
      <button class="btn-icon sidebar-close" id="sidebarClose">✕</button>
    </div>
    <nav class="sidebar-nav">
      <a href="#" class="nav-item active" data-filter="all"><span class="nav-icon">📋</span><span class="nav-label">Tutti i compiti</span><span class="nav-badge" id="badge-all"></span></a>
      <a href="#" class="nav-item" data-filter="today"><span class="nav-icon">📅</span><span class="nav-label">Oggi</span><span class="nav-badge" id="badge-today"></span></a>
      <a href="#" class="nav-item" data-filter="week"><span class="nav-icon">🗓️</span><span class="nav-label">Questa settimana</span><span class="nav-badge" id="badge-week"></span></a>
      <a href="#" class="nav-item" data-filter="overdue"><span class="nav-icon">🔴</span><span class="nav-label">In ritardo</span><span class="nav-badge urgent" id="badge-overdue"></span></a>
      <a href="#" class="nav-item" data-filter="high"><span class="nav-icon">🔥</span><span class="nav-label">Alta priorità</span><span class="nav-badge" id="badge-high"></span></a>
      <a href="#" class="nav-item" data-filter="done"><span class="nav-icon">✅</span><span class="nav-label">Completati</span><span class="nav-badge" id="badge-done"></span></a>
    </nav>
    <div class="sidebar-footer">
      <button class="btn-notif" id="notifBtn"><span id="notifIcon">🔔</span><span id="notifLabel">Abilita notifiche</span></button>
    </div>
  </aside>

  <div class="overlay" id="overlay"></div>

  <main class="main">
    <header class="topbar">
      <button class="btn-icon menu-toggle" id="menuToggle">☰</button>
      <h1 class="page-title" id="pageTitle">Tutti i compiti</h1>
      <div class="topbar-actions">
        <button class="btn-icon" id="themeToggle" title="Cambia tema">🌙</button>
      </div>
    </header>

    <section class="quick-add">
      <form class="quick-add-form" id="quickAddForm" autocomplete="off">
        <input type="text" class="quick-add-input" id="quickAddInput" placeholder="Aggiungi nuovo compito... (Invio per salvare)" maxlength="200" required />
        <div class="quick-add-meta">
          <div class="field-group">
            <label class="field-label" for="quickDate">Scadenza</label>
            <input type="date" class="field-input" id="quickDate" />
          </div>
          <div class="field-group">
            <label class="field-label" for="quickPriority">Priorità</label>
            <select class="field-input" id="quickPriority">
              <option value="none">—</option>
              <option value="low">Bassa</option>
              <option value="medium">Media</option>
              <option value="high">Alta</option>
            </select>
          </div>
          <div class="field-group">
            <label class="field-label" for="quickCategory">Categoria</label>
            <select class="field-input" id="quickCategory">
              <option value="work">Lavoro</option>
              <option value="personal">Personale</option>
              <option value="other">Altro</option>
            </select>
          </div>
          <button type="submit" class="btn-add">+ Aggiungi</button>
        </div>
      </form>
    </section>

    <div class="controls">
      <div class="sort-group">
        <label class="controls-label">Ordina:</label>
        <select class="sort-select" id="sortSelect">
          <option value="dueDate">Scadenza</option>
          <option value="priority">Priorità</option>
          <option value="created">Data creazione</option>
          <option value="title">Titolo</option>
        </select>
      </div>
      <div class="view-group">
        <button class="btn-view active" id="viewList">☰</button>
        <button class="btn-view" id="viewGrid">⊞</button>
      </div>
    </div>

    <section class="task-container">
      <div class="task-list" id="taskList"></div>
      <div class="empty-state" id="emptyState" hidden>
        <div class="empty-icon">📭</div>
        <p class="empty-title">Nessun compito trovato</p>
        <p class="empty-sub">Aggiungi un compito usando la barra qui sopra</p>
      </div>
    </section>
  </main>

  <div class="modal-backdrop" id="modalBackdrop" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-header">
        <h2 class="modal-title">Modifica compito</h2>
        <button class="btn-icon" id="modalClose">✕</button>
      </div>
      <form class="modal-form" id="modalForm">
        <input type="hidden" id="editId" />
        <div class="form-group">
          <label class="form-label" for="editTitle">Titolo *</label>
          <input type="text" class="form-input" id="editTitle" maxlength="200" required />
        </div>
        <div class="form-group">
          <label class="form-label" for="editDesc">Descrizione</label>
          <textarea class="form-input form-textarea" id="editDesc" rows="3" maxlength="1000"></textarea>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="editDate">Scadenza</label>
            <input type="date" class="form-input" id="editDate" />
          </div>
          <div class="form-group">
            <label class="form-label" for="editPriority">Priorità</label>
            <select class="form-input" id="editPriority">
              <option value="none">Nessuna</option>
              <option value="low">Bassa</option>
              <option value="medium">Media</option>
              <option value="high">Alta</option>
            </select>
          </div>
        </div>
        <div class="form-group">
          <label class="form-label" for="editCategory">Categoria</label>
          <select class="form-input" id="editCategory">
            <option value="work">Lavoro</option>
            <option value="personal">Personale</option>
            <option value="other">Altro</option>
          </select>
        </div>
        <div class="modal-actions">
          <button type="button" class="btn-secondary" id="modalCancel">Annulla</button>
          <button type="submit" class="btn-primary">Salva modifiche</button>
        </div>
      </form>
    </div>
  </div>

  <div class="toast-container" id="toastContainer" aria-live="polite"></div>

  <nav class="bottom-nav">
    <a href="#" class="bottom-nav-item active" data-filter="all"><span class="bottom-nav-icon">📋</span><span>Tutti</span></a>
    <a href="#" class="bottom-nav-item" data-filter="today"><span class="bottom-nav-icon">📅</span><span>Oggi</span></a>
    <a href="#" class="bottom-nav-item" data-filter="overdue"><span class="bottom-nav-icon">🔴</span><span>Ritardo</span></a>
    <a href="#" class="bottom-nav-item" data-filter="high"><span class="bottom-nav-icon">🔥</span><span>Urgenti</span></a>
    <a href="#" class="bottom-nav-item" data-filter="done"><span class="bottom-nav-icon">✅</span><span>Fatti</span></a>
  </nav>

  <script>
const STORAGE_KEY='taskflow_tasks',THEME_KEY='taskflow_theme';
function loadTasks(){try{return JSON.parse(localStorage.getItem(STORAGE_KEY))||[]}catch{return[]}}
function saveTasks(t){localStorage.setItem(STORAGE_KEY,JSON.stringify(t))}
function today(){const d=new Date();return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function weekEnd(){const d=new Date();d.setDate(d.getDate()+7);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
function formatDate(s){if(!s)return null;const[y,m,d]=s.split('-'),mo=['gen','feb','mar','apr','mag','giu','lug','ago','set','ott','nov','dic'];return`${parseInt(d)} ${mo[parseInt(m)-1]} ${y}`}
function dateStatus(s){if(!s)return null;const t=today();if(s<t)return'overdue';if(s===t)return'today';if(s<=weekEnd())return'soon';return'future'}
function dateLabel(s){const st=dateStatus(s);if(st==='overdue')return'⚠ Scaduto';if(st==='today')return'📅 Oggi';return`📅 ${formatDate(s)}`}
const PRIORITY_ORDER={high:0,medium:1,low:2,none:3};
const PRIORITY_LABEL={high:'🔥 Alta',medium:'⚡ Media',low:'✓ Bassa',none:''};
const PRIORITY_CLASS={high:'badge-priority-high',medium:'badge-priority-medium',low:'badge-priority-low',none:'badge-priority-none'};
const CAT_CLASS={work:'badge-cat-work',personal:'badge-cat-personal',other:'badge-cat-other'};
const CAT_LABEL={work:'💼 Lavoro',personal:'🏠 Personale',other:'📌 Altro'};
const FILTER_TITLES={all:'Tutti i compiti',today:'Oggi',week:'Questa settimana',overdue:'In ritardo',high:'Alta priorità',done:'Completati'};
let tasks=loadTasks(),activeFilter='all',activeSort='dueDate';
const $=id=>document.getElementById(id);
const taskList=$('taskList'),emptyState=$('emptyState'),quickAddForm=$('quickAddForm'),quickAddInput=$('quickAddInput'),quickDate=$('quickDate'),quickPriority=$('quickPriority'),quickCategory=$('quickCategory'),sortSelect=$('sortSelect'),pageTitle=$('pageTitle'),sidebar=$('sidebar'),overlay=$('overlay'),themeToggle=$('themeToggle'),modalBackdrop=$('modalBackdrop'),modalForm=$('modalForm'),notifBtn=$('notifBtn'),notifIcon=$('notifIcon'),notifLabel=$('notifLabel'),toastContainer=$('toastContainer'),viewList=$('viewList'),viewGrid=$('viewGrid');
function applyTheme(dark){document.documentElement.dataset.theme=dark?'dark':'light';themeToggle.textContent=dark?'☀️':'🌙';localStorage.setItem(THEME_KEY,dark?'dark':'light')}
const saved=localStorage.getItem(THEME_KEY);
applyTheme(saved?saved==='dark':window.matchMedia('(prefers-color-scheme: dark)').matches);
themeToggle.addEventListener('click',()=>applyTheme(document.documentElement.dataset.theme!=='dark'));
function openSidebar(){sidebar.classList.add('open');overlay.classList.add('visible');document.body.style.overflow='hidden'}
function closeSidebar(){sidebar.classList.remove('open');overlay.classList.remove('visible');document.body.style.overflow=''}
$('menuToggle').addEventListener('click',openSidebar);
$('sidebarClose').addEventListener('click',closeSidebar);
overlay.addEventListener('click',closeSidebar);
function setFilter(f){activeFilter=f;pageTitle.textContent=FILTER_TITLES[f];document.querySelectorAll('[data-filter]').forEach(el=>el.classList.toggle('active',el.dataset.filter===f));renderTasks();closeSidebar()}
document.querySelectorAll('[data-filter]').forEach(el=>el.addEventListener('click',e=>{e.preventDefault();setFilter(el.dataset.filter)}));
sortSelect.addEventListener('change',()=>{activeSort=sortSelect.value;renderTasks()});
viewList.addEventListener('click',()=>{viewList.classList.add('active');viewGrid.classList.remove('active');taskList.classList.remove('grid-view')});
viewGrid.addEventListener('click',()=>{viewGrid.classList.add('active');viewList.classList.remove('active');taskList.classList.add('grid-view')});
function applyFilter(t){const td=today(),w=weekEnd();switch(activeFilter){case'all':return!t.done;case'today':return!t.done&&t.dueDate===td;case'week':return!t.done&&t.dueDate&&t.dueDate>=td&&t.dueDate<=w;case'overdue':return!t.done&&t.dueDate&&t.dueDate<td;case'high':return!t.done&&t.priority==='high';case'done':return t.done;default:return true}}
function sortTasks(a,b){if(activeSort==='priority'){const pd=PRIORITY_ORDER[a.priority]-PRIORITY_ORDER[b.priority];if(pd!==0)return pd}if(activeSort==='dueDate'||activeSort==='priority'){if(a.dueDate&&b.dueDate)return a.dueDate.localeCompare(b.dueDate);if(a.dueDate)return -1;if(b.dueDate)return 1}if(activeSort==='title')return a.title.localeCompare(b.title);return b.createdAt-a.createdAt}
function esc(s){return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;')}
function buildCard(t){const ds=t.dueDate?dateStatus(t.dueDate):null,dl=t.dueDate?dateLabel(t.dueDate):null,pc=PRIORITY_CLASS[t.priority],pl=PRIORITY_LABEL[t.priority],cc=CAT_CLASS[t.category]||CAT_CLASS.other,cl=CAT_LABEL[t.category]||CAT_LABEL.other;return`<div class="task-card ${t.done?'done':''}" data-id="${t.id}" data-priority="${t.priority}"><div class="task-checkbox" role="checkbox" aria-checked="${t.done}" tabindex="0">${t.done?'✓':''}</div><div class="task-body"><div class="task-title">${esc(t.title)}</div>${t.description?`<div class="task-desc">${esc(t.description)}</div>`:''}<div class="task-meta">${pl?`<span class="badge ${pc}">${pl}</span>`:''}${dl?`<span class="badge badge-date ${ds||''}">${dl}</span>`:''}<span class="badge ${cc}">${cl}</span></div></div><div class="task-actions"><button class="task-action-btn edit" title="Modifica">✏️</button><button class="task-action-btn delete" title="Elimina">🗑️</button></div></div>`}
function renderTasks(){const f=tasks.filter(applyFilter).sort(sortTasks);if(f.length===0){taskList.innerHTML='';emptyState.hidden=false}else{emptyState.hidden=true;taskList.innerHTML=f.map(buildCard).join('')}updateBadges()}
function updateBadges(){const td=today(),w=weekEnd(),ac=tasks.filter(t=>!t.done);$('badge-all').textContent=ac.length||'';$('badge-today').textContent=ac.filter(x=>x.dueDate===td).length||'';$('badge-week').textContent=ac.filter(x=>x.dueDate&&x.dueDate>=td&&x.dueDate<=w).length||'';$('badge-overdue').textContent=ac.filter(x=>x.dueDate&&x.dueDate<td).length||'';$('badge-high').textContent=ac.filter(x=>x.priority==='high').length||'';$('badge-done').textContent=tasks.filter(x=>x.done).length||''}
taskList.addEventListener('click',e=>{const card=e.target.closest('.task-card');if(!card)return;const id=card.dataset.id;if(e.target.closest('.task-checkbox')){toggleDone(id);return}if(e.target.closest('.edit')){openEdit(id);return}if(e.target.closest('.delete')){deleteTask(id)}});
taskList.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('task-checkbox')){e.preventDefault();const c=e.target.closest('.task-card');if(c)toggleDone(c.dataset.id)}});
function createTask({title,description='',dueDate='',priority='none',category='work'}){const t={id:Date.now().toString(36)+Math.random().toString(36).slice(2),title:title.trim(),description:description.trim(),dueDate,priority,category,done:false,createdAt:Date.now()};tasks.unshift(t);saveTasks(tasks);return t}
function toggleDone(id){const t=tasks.find(x=>x.id===id);if(!t)return;t.done=!t.done;saveTasks(tasks);renderTasks();toast(t.done?'✅ Completato!':'↩ Riattivato','success')}
function deleteTask(id){const i=tasks.findIndex(x=>x.id===id);if(i===-1)return;const[r]=tasks.splice(i,1);saveTasks(tasks);renderTasks();toast(`🗑️ "${r.title.slice(0,30)}" eliminato`,'info')}
function updateTask(id,fields){const t=tasks.find(x=>x.id===id);if(!t)return;Object.assign(t,fields);saveTasks(tasks);renderTasks()}
quickAddForm.addEventListener('submit',e=>{e.preventDefault();const title=quickAddInput.value.trim();if(!title)return;createTask({title,dueDate:quickDate.value,priority:quickPriority.value,category:quickCategory.value});quickAddInput.value='';quickDate.value='';quickPriority.value='none';quickCategory.value='work';renderTasks();toast('✅ Compito aggiunto','success');notifyCheck()});
quickDate.min=today();
function openEdit(id){const t=tasks.find(x=>x.id===id);if(!t)return;$('editId').value=id;$('editTitle').value=t.title;$('editDesc').value=t.description;$('editDate').value=t.dueDate;$('editPriority').value=t.priority;$('editCategory').value=t.category;modalBackdrop.hidden=false;$('editTitle').focus()}
function closeModal(){modalBackdrop.hidden=true}
$('modalClose').addEventListener('click',closeModal);
$('modalCancel').addEventListener('click',closeModal);
modalBackdrop.addEventListener('click',e=>{if(e.target===modalBackdrop)closeModal()});
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='n'&&!e.ctrlKey&&!e.metaKey&&!['INPUT','SELECT','TEXTAREA'].includes(document.activeElement.tagName)){e.preventDefault();quickAddInput.focus()}});
modalForm.addEventListener('submit',e=>{e.preventDefault();const id=$('editId').value;updateTask(id,{title:$('editTitle').value.trim(),description:$('editDesc').value.trim(),dueDate:$('editDate').value,priority:$('editPriority').value,category:$('editCategory').value});closeModal();toast('💾 Salvato','success')});
function toast(msg,type='info',ms=3000){const el=document.createElement('div');el.className=`toast toast-${type}`;el.textContent=msg;toastContainer.appendChild(el);setTimeout(()=>{el.classList.add('hiding');el.addEventListener('transitionend',()=>el.remove())},ms)}
function updateNotifUI(){const p=Notification.permission;notifIcon.textContent=p==='denied'?'🔕':'🔔';notifLabel.textContent=p==='granted'?'Notifiche attive':p==='denied'?'Notifiche bloccate':'Abilita notifiche'}
notifBtn.addEventListener('click',async()=>{if(!('Notification'in window)){toast('❌ Non supportate','error');return}if(Notification.permission==='denied'){toast('⚠ Abilita nelle impostazioni browser','error');return}const p=await Notification.requestPermission();updateNotifUI();if(p==='granted'){toast('✅ Notifiche abilitate!','success');notifyCheck()}});
function notifyCheck(){if(Notification.permission!=='granted')return;const td=today(),ov=tasks.filter(x=>!x.done&&x.dueDate&&x.dueDate<td),to=tasks.filter(x=>!x.done&&x.dueDate===td);if(ov.length)new Notification('⚠️ Compiti scaduti — TaskFlow',{body:`Hai ${ov.length} compito/i scaduto/i.`});if(to.length)new Notification('📅 Scadenza oggi — TaskFlow',{body:to.map(t=>`• ${t.title}`).slice(0,5).join('\n')})}
function seedDemo(){if(tasks.length>0)return;const td=today();function addDays(n){const d=new Date();d.setDate(d.getDate()+n);return`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`}
[{title:'Revisione relazione trimestrale',description:'Controllare e aggiornare i dati del Q1',dueDate:td,priority:'high',category:'work'},{title:'Chiamata con il cliente Rossi',description:'Presentare il piano di progetto',dueDate:addDays(1),priority:'high',category:'work'},{title:'Pagare bolletta luce',dueDate:addDays(-1),priority:'medium',category:'personal'},{title:'Preparare presentazione',description:'Slide per meeting di venerdì',dueDate:addDays(5),priority:'medium',category:'work'},{title:'Comprare regalo anniversario',dueDate:addDays(5),priority:'low',category:'personal'},{title:'Aggiornare documentazione API',description:'Aggiungere esempi per i nuovi endpoint',dueDate:'',priority:'low',category:'work'}].forEach(d=>tasks.push({...d,id:Date.now().toString(36)+Math.random().toString(36).slice(2),done:false,createdAt:Date.now()-Math.random()*86400000}));saveTasks(tasks)}
seedDemo();updateNotifUI();renderTasks();
  </script>
</body>
</html>
